<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0b2748"><meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="CHẤM CÔNG">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>CUATUNG LIGHTING – QUẢN LÝ CHẤM CÔNG V7.5.0</title>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img src="assets/logo.png" alt="Cuatung Lighting">
    <div class="brand-copy"><b>CUATUNG LIGHTING</b><span>QUẢN LÝ CHẤM CÔNG</span></div>
  </div>
  <div class="online ready" id="netState">SẴN SÀNG</div>
</header>
<main id="app">
<section class="screen wrap login-screen">
  <div class="login">
    <img class="login-logo" src="assets/logo.png" alt="Cuatung Lighting">
    <div class="login-heading">
      <h1 class="title">QUẢN LÝ CHẤM CÔNG</h1>
      <div class="company-name">Cuatung Lighting</div>
    </div>
    <form id="bootForm">
      <div class="field"><label>Số điện thoại</label><input id="bootPhone" inputmode="tel" autocomplete="username" required></div>
      <div class="field"><label>Mật khẩu</label><input id="bootPassword" type="password" autocomplete="current-password" required></div>
      <button class="btn primary full" type="submit">ĐĂNG NHẬP</button>
      <p id="bootStatus" class="helper">Sẵn sàng đăng nhập</p>
    </form>
  </div>
</section>
</main>
<div id="toast" class="toast"></div>
<div id="modal" class="modal hidden"><div class="modal-card"><h3 id="modalTitle">Xác nhận</h3><p id="modalText"></p><div class="actions"><button class="btn light" id="modalCancel">HỦY</button><button class="btn primary" id="modalOk">TIẾP TỤC</button></div></div></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
